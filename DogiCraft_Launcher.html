<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogiCraft Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e24, #0f0f12);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #launcher-container {
            background-color: #2b2b36;
            width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #3f3f50;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #4e9f3d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.95rem;
            color: #a0a0b0;
            margin-bottom: 24px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: #1e1e24;
            color: #ffffff;
            border: 1px solid #3f3f50;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #4e9f3d;
        }

        optgroup {
            color: #888;
        }

        option {
            background-color: #1e1e24;
            color: #fff;
        }

        .launch-btn {
            width: 100%;
            padding: 14px;
            background-color: #4e9f3d;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .launch-btn:hover {
            background-color: #1e5128;
        }

        .launch-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="launcher-container">
        <h1>DogiCraft Launcher</h1>
        <p>Select a version to launch.</p>
        
        <div class="controls">
            <select id="version-select">
                <option value="DogiCraft 1.0.html">Version 1.0</option>
                <option value="DogiCraft 1.1.html">Version 1.1</option>
                <option value="DogiCraft 1.2.html">Version 1.2</option>
                <option value="DogiCraft 1.3.html">Version 1.3</option>
                <optgroup label="Experimental Versions">
                    <option value="DogiCraft_Multiplayer.html">Version 1.4 (Multiplayer)</option>
                    <option value="DogiCraft_Alpha.html">Version 1.5 (Alpha)</option>
                    <option value="Copy_DogiCraft_Test.html">Version 1.6 (Test)</option>
                    <option value="DogiCraft 1.0.7.html">Version 1.7</option>
                </optgroup>
            </select>

            <button class="launch-btn" onclick="launchGame()">Play</button>
        </div>
    </div>

    <script>
        function launchGame() {
            const selectedVersion = document.getElementById('version-select').value;
            if (selectedVersion) {
                window.location.href = selectedVersion;
            }
        }
    </script>
</body>
</html>
