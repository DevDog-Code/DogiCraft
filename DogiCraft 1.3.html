<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogiCraft 1.0.6</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #000; }

        /* --- OVERLAY & MENU UI --- */
        .menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), radial-gradient(circle, #3a506b 0%, #0b132b 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }

        .title-logo {
            font-size: 48px; font-weight: 900; color: #ddd; text-shadow: 4px 4px 0px #111;
            letter-spacing: 3px; margin-bottom: 25px; background: #333; padding: 10px 25px;
            border: 4px solid #111; box-shadow: inset -4px -4px 0px #111, inset 4px 4px 0px #666;
        }

        .mc-button {
            width: 300px; height: 46px; margin: 6px 0; background: #555; border: 3px solid #000;
            color: #fff; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer;
            text-shadow: 2px 2px 0px #000; box-shadow: inset -3px -3px 0px #222, inset 3px 3px 0px #888;
            display: flex; align-items: center; justify-content: center; border-radius: 2px;
        }
        .mc-button:hover { background: #666; }
        .mc-button:active { box-shadow: inset 3px 3px 0px #222, inset -3px -3px 0px #888; }
        .mc-input {
            width: 300px; padding: 10px; margin: 6px 0; background: #111; border: 2px solid #555;
            color: #00ff88; font-family: inherit; text-align: center; border-radius: 2px;
        }

        .world-list { width: 340px; max-height: 200px; background: #111; border: 2px solid #444; margin: 15px 0; overflow-y: auto; }
        .world-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .world-item:hover, .world-item.selected { background: #222; border-left: 4px solid #00ff88; }

        /* --- HUD & HUD ELEMENTS --- */
        #game-hud { display: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 14px; height: 14px; pointer-events: none; border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%; mix-blend-mode: difference; z-index: 10;
        }

        #health-bar { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 10; }
        .heart { width: 18px; height: 18px; background: red; clip-path: polygon(50% 15%, 80% 0%, 100% 35%, 100% 70%, 50% 100%, 0% 70%, 0% 35%, 20% 0%); }
        .heart.empty { background: #333; }

        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; background: rgba(0, 0, 0, 0.65); padding: 6px;
            border-radius: 6px; border: 2px solid #444; z-index: 10;
        }
        .slot {
            width: 44px; height: 44px; background: rgba(40, 40, 40, 0.8); border: 2px solid #333;
            color: white; display: flex; align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; border-radius: 4px;
        }
        .slot.active { border-color: #00ff88; background: rgba(80, 80, 80, 0.9); }

        #server-tag {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: #00ff88;
            padding: 8px 14px; border-radius: 4px; border: 1px solid #00ff88; font-size: 12px; z-index: 10;
        }

        /* --- INVENTORY MODAL --- */
        #inventory-menu {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); padding: 20px; border-radius: 8px; color: white;
            width: 320px; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 2px solid #444; z-index: 200;
        }
        #item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 220px; overflow-y: auto; margin-top: 10px; }
        .grid-item { background: #2a2a2a; padding: 8px; border: 1px solid #444; border-radius: 4px; cursor: pointer; text-align: center; font-size: 12px; }
        .grid-item:hover { background: #00ff88; color: black; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="main-menu" class="menu-screen">
        <div class="title-logo">DogiCraft 1.0.6</div>
        <button class="mc-button" onclick="openWorldMenu()">Singleplayer / Worlds</button>
        <button class="mc-button" onclick="openMultiplayerMenu()">Join P2P Server</button>
        <button class="mc-button" onclick="alert('WASD = Move\nSPACE = Jump\nE = Inventory\nLEFT CLICK = Mine Block\nRIGHT CLICK = Place Block\n1-5 / Scroll = Select Slot\nESC = Pause Menu')">Controls</button>
    </div>

    <div id="world-menu" class="menu-screen" style="display: none;">
        <h2>World Selection</h2>
        <div class="world-list" id="world-list-container"></div>
        <button class="mc-button" onclick="createNewWorldPrompt()">+ Create New World</button>
        <button class="mc-button" id="btn-launch-world" onclick="launchSelectedWorld()">Play Selected World</button>
        <button class="mc-button" onclick="backToMain()">Back</button>
    </div>

    <div id="multiplayer-menu" class="menu-screen" style="display: none;">
        <h2>Join Multiplayer Room</h2>
        <input type="text" id="join-room-id" class="mc-input" placeholder="Paste World Server ID...">
        <button class="mc-button" onclick="joinMultiplayerWorld()">Connect & Join World</button>
        <div id="mp-status" style="color: #ffaa00; font-size: 12px; margin: 8px 0;"></div>
        <button class="mc-button" onclick="backToMain()">Back</button>
    </div>

    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="server-tag">Server ID: <span id="current-server-id">---</span></div>
        <div id="health-bar">
            <div class="heart"></div><div class="heart"></div><div class="heart"></div><div class="heart"></div><div class="heart"></div>
            <div class="heart"></div><div class="heart"></div><div class="heart"></div><div class="heart"></div><div class="heart"></div>
        </div>
        <div id="hotbar">
            <div class="slot active" data-block="grass">🟩</div>
            <div class="slot" data-block="dirt">🟫</div>
            <div class="slot" data-block="stone">🪨</div>
            <div class="slot" data-block="wood">🪵</div>
            <div class="slot" data-block="glass">𔔲</div>
        </div>
    </div>

    <div id="pause-screen" class="menu-screen" style="display: none;">
        <h2>Game Paused</h2>
        <button class="mc-button" onclick="resumeGame()">Resume</button>
        <button class="mc-button" onclick="saveCurrentWorld()">Save World</button>
        <button class="mc-button" onclick="quitToTitle()">Save & Exit to Title</button>
    </div>

    <div id="game-over" class="menu-screen" style="display: none; background: rgba(150, 0, 0, 0.85);">
        <h1>YOU DIED!</h1>
        <button class="mc-button" onclick="respawnPlayer()">Respawn</button>
    </div>

    <div id="inventory-menu">
        <h3 style="text-align: center; color: #00ff88; margin-bottom: 8px;">🎒 Select Block</h3>
        <div id="item-grid">
            <div class="grid-item" data-block="grass">Grass 🟩</div>
            <div class="grid-item" data-block="dirt">Dirt 🟫</div>
            <div class="grid-item" data-block="stone">Stone 🪨</div>
            <div class="grid-item" data-block="wood">Wood 🪵</div>
            <div class="grid-item" data-block="sand">Sand 🟨</div>
            <div class="grid-item" data-block="glass">Glass 𔔲</div>
            <div class="grid-item" data-block="crafting_table">Crafting Table 🛠️</div>
            <div class="grid-item" data-block="door">Door 🚪</div>
            <div class="grid-item" data-block="obsidian">Obsidian 🔮</div>
            <div class="grid-item" data-block="water">Water 🟦</div>
        </div>
    </div>

    <script>
        // --- GLOBAL VARIABLES & STATE ---
        let worlds = JSON.parse(localStorage.getItem('dogicraft_worlds') || '{}');
        let selectedWorldId = null;
        let activeWorldData = null;

        let peer = null, connections = [], isHost = false, currentPeerId = null;
        let gameStarted = false, isInventoryOpen = false;

        const blockEmojis = { grass: '🟩', dirt: '🟫', stone: '🪨', wood: '🪵', sand: '🟨', glass: '𔔲', crafting_table: '🛠️', door: '🚪', obsidian: '🔮', water: '🟦' };
        let activeSlotIndex = 0;

        // Web Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBlockSound(freq = 120, duration = 0.08) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // --- MENU NAVIGATION & WORLD MANAGEMENT ---
        function openWorldMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('world-menu').style.display = 'flex';
            renderWorldList();
        }

        function openMultiplayerMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('multiplayer-menu').style.display = 'flex';
        }

        function backToMain() {
            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('multiplayer-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        }

        function renderWorldList() {
            const container = document.getElementById('world-list-container');
            container.innerHTML = '';
            const keys = Object.keys(worlds);
            if (keys.length === 0) {
                container.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">No worlds saved. Create one below!</div>';
                return;
            }

            keys.forEach(id => {
                const item = document.createElement('div');
                item.className = `world-item ${selectedWorldId === id ? 'selected' : ''}`;
                item.innerHTML = `<div><strong>${worlds[id].name}</strong><br><small style="color:#888;">ID: ${id}</small></div>`;
                item.onclick = () => {
                    selectedWorldId = id;
                    renderWorldList();
                };
                container.appendChild(item);
            });
        }

        function createNewWorldPrompt() {
            const name = prompt("Enter World Name:", "My Survival World");
            if (!name) return;
            // Generate Unique Unique Server ID per world
            const newServerId = 'world-' + Math.random().toString(36).substring(2, 9);
            worlds[newServerId] = {
                id: newServerId,
                name: name,
                modifications: {}
            };
            localStorage.setItem('dogicraft_worlds', JSON.stringify(worlds));
            selectedWorldId = newServerId;
            renderWorldList();
        }

        function launchSelectedWorld() {
            if (!selectedWorldId || !worlds[selectedWorldId]) return alert("Select or create a world first!");
            activeWorldData = worlds[selectedWorldId];
            isHost = true;

            // Initialize Peer with unique world server ID
            initNetworking(activeWorldData.id, () => {
                startEngine();
            });
        }

        function joinMultiplayerWorld() {
            const roomId = document.getElementById('join-room-id').value.trim();
            if (!roomId) return alert("Please enter a valid Server ID!");
            document.getElementById('mp-status').textContent = "Connecting to Server ID...";

            isHost = false;
            initNetworking(null, (myId) => {
                const conn = peer.connect(roomId);
                setupConnection(conn);
                conn.on('open', () => {
                    activeWorldData = { id: roomId, modifications: {} };
                    startEngine();
                });
            });
        }

        // --- NETWORKING (PEERJS) ---
        function initNetworking(customServerId, callback) {
            peer = customServerId ? new Peer(customServerId) : new Peer();
            peer.on('open', (id) => {
                currentPeerId = id;
                document.getElementById('current-server-id').textContent = id;
                if (callback) callback(id);
            });
            peer.on('connection', setupConnection);
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Unique fallback if host ID is active
                    initNetworking(customServerId + '-' + Math.floor(Math.random() * 100), callback);
                } else {
                    document.getElementById('mp-status').textContent = "Connection Error: " + err.type;
                }
            });
        }

        function setupConnection(conn) {
            connections.push(conn);
            conn.on('open', () => {
                if (isHost && activeWorldData) {
                    conn.send({ type: 'syncWorld', modifications: activeWorldData.modifications });
                }
            });
            conn.on('data', (data) => {
                if (data.type === 'syncWorld') {
                    Object.assign(activeWorldData.modifications, data.modifications);
                    updateChunks(true);
                } else if (data.type === 'blockEdit') {
                    activeWorldData.modifications[data.key] = data.blockType;
                    rebuildBlockAt(data.key, data.blockType);
                    if (isHost) broadcastData(data, conn);
                }
            });
        }

        function broadcastData(data, excludeConn = null) {
            connections.forEach(c => { if (c !== excludeConn && c.open) c.send(data); });
        }

        // --- 3D THREE.JS ENGINE & GAMEPLAY ---
        let scene, camera, renderer, controls;
        let objects = [], loadedChunks = new Map();
        const simplex = new SimplexNoise();
        const blockSize = 1, chunkSize = 10, renderDistance = 2;

        const blockGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4caf50 }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
            stone: new THREE.MeshLambertMaterial({ color: 0x808080 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x5c4033 }),
            sand: new THREE.MeshLambertMaterial({ color: 0xecd9b0 }),
            glass: new THREE.MeshLambertMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.6 }),
            crafting_table: new THREE.MeshLambertMaterial({ color: 0xd2b48c }),
            door: new THREE.MeshLambertMaterial({ color: 0xa0522d }),
            obsidian: new THREE.MeshLambertMaterial({ color: 0x3b1e54 }),
            water: new THREE.MeshLambertMaterial({ color: 0x2980b9, transparent: true, opacity: 0.7 })
        };

        function startEngine() {
            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('multiplayer-menu').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff);
            scene.fog = new THREE.FogExp2(0x78a7ff, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const existingCanvas = document.querySelector('canvas');
            if (existingCanvas) existingCanvas.remove();
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(40, 60, 20);
            scene.add(dirLight);

            controls = new THREE.PointerLockControls(camera, document.body);
            controls.addEventListener('unlock', () => {
                if (gameStarted && !isDead && !isInventoryOpen) {
                    document.getElementById('pause-screen').style.display = 'flex';
                }
            });

            camera.position.set(0, 12, 0);
            gameStarted = true;
            health = 10; isDead = false;
            updateHealthUI();

            controls.lock();
            animate();
        }

        // --- PROCEDURAL GENERATION & CHUNK BUILDER ---
        function generateHeight(x, z) {
            return Math.floor(simplex.noise2D(x * 0.04, z * 0.04) * 4) + 3;
        }

        function updateChunks(force = false) {
            const playerCX = Math.floor(camera.position.x / chunkSize);
            const playerCZ = Math.floor(camera.position.z / chunkSize);

            for (let cx = playerCX - renderDistance; cx <= playerCX + renderDistance; cx++) {
                for (let cz = playerCZ - renderDistance; cz <= playerCZ + renderDistance; cz++) {
                    const key = `${cx},${cz}`;
                    if (!loadedChunks.has(key) || force) {
                        buildChunk(cx, cz);
                        loadedChunks.set(key, true);
                    }
                }
            }
        }

        function buildChunk(cx, cz) {
            const startX = cx * chunkSize;
            const startZ = cz * chunkSize;

            for (let x = 0; x < chunkSize; x++) {
                for (let z = 0; z < chunkSize; z++) {
                    const wx = startX + x;
                    const wz = startZ + z;
                    const height = generateHeight(wx, wz);

                    for (let y = height - 2; y <= height; y++) {
                        const blockKey = `${wx},${y},${wz}`;
                        let type = activeWorldData.modifications[blockKey];

                        if (type === undefined) {
                            type = (y === height) ? 'grass' : ((y >= height - 2) ? 'dirt' : 'stone');
                        }

                        if (type !== 'air') {
                            const mesh = new THREE.Mesh(blockGeometry, materials[type] || materials.grass);
                            mesh.position.set(wx, y, wz);
                            mesh.userData = { key: blockKey, type: type };
                            scene.add(mesh);
                            objects.push(mesh);
                        }
                    }
                }
            }
        }

        function rebuildBlockAt(key, type) {
            const [x, y, z] = key.split(',').map(Number);
            for (let i = objects.length - 1; i >= 0; i--) {
                if (objects[i].position.x === x && objects[i].position.y === y && objects[i].position.z === z) {
                    scene.remove(objects[i]);
                    objects.splice(i, 1);
                }
            }

            if (type !== 'air' && materials[type]) {
                const mesh = new THREE.Mesh(blockGeometry, materials[type]);
                mesh.position.set(x, y, z);
                mesh.userData = { key: key, type: type };
                scene.add(mesh);
                objects.push(mesh);
            }
        }

        // --- HEALTH & DAMAGE SYSTEM ---
        let health = 10, isDead = false;
        function updateHealthUI() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, idx) => {
                if (idx < health) h.classList.remove('empty');
                else h.classList.add('empty');
            });
        }

        function takeDamage(amount) {
            if (isDead) return;
            health = Math.max(0, health - amount);
            updateHealthUI();
            playBlockSound(60, 0.2);
            if (health === 0) {
                isDead = true;
                controls.unlock();
                document.getElementById('game-over').style.display = 'flex';
            }
        }

        function respawnPlayer() {
            health = 10; isDead = false;
            updateHealthUI();
            document.getElementById('game-over').style.display = 'none';
            camera.position.set(0, 15, 0);
            velocityY = 0;
            controls.lock();
        }

        // --- PHYSICS, INPUT & INVENTORY LOGIC ---
        let velocityY = 0, canJump = false;
        const gravity = -0.012, playerHeight = 1.6;
        const keys = {};

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            if (key === 'e' && gameStarted && !isDead) {
                toggleInventoryMenu();
            }

            if (!isNaN(e.key) && parseInt(e.key) >= 1 && parseInt(e.key) <= 5) {
                selectHotbarSlot(parseInt(e.key) - 1);
            }

            if (e.code === 'Space' && canJump && gameStarted && !isDead) {
                velocityY = 0.22;
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function selectHotbarSlot(index) {
            const slots = document.querySelectorAll('#hotbar .slot');
            slots.forEach((s, idx) => s.classList.toggle('active', idx === index));
            activeSlotIndex = index;
        }

        function toggleInventoryMenu() {
            isInventoryOpen = !isInventoryOpen;
            const menu = document.getElementById('inventory-menu');
            if (isInventoryOpen) {
                menu.style.display = 'block';
                controls.unlock();
            } else {
                menu.style.display = 'none';
                controls.lock();
            }
        }

        document.querySelectorAll('.grid-item').forEach(item => {
            item.onclick = () => {
                const block = item.getAttribute('data-block');
                const slot = document.querySelectorAll('#hotbar .slot')[activeSlotIndex];
                slot.setAttribute('data-block', block);
                slot.textContent = blockEmojis[block] || '📦';
                toggleInventoryMenu();
            };
        });

        // Block Mining and Placement
        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', (e) => {
            if (!controls || !controls.isLocked || isDead || isInventoryOpen) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.distance > 6) return;

                if (e.button === 0) { // Mine Block
                    const key = hit.object.userData.key;
                    activeWorldData.modifications[key] = 'air';
                    rebuildBlockAt(key, 'air');
                    playBlockSound(140);
                    broadcastData({ type: 'blockEdit', key: key, blockType: 'air' });
                } else if (e.button === 2) { // Place Block
                    const slot = document.querySelectorAll('#hotbar .slot')[activeSlotIndex];
                    const blockToPlace = slot.getAttribute('data-block');

                    if (blockToPlace) {
                        const placePos = hit.object.position.clone().add(hit.face.normal);
                        const key = `${placePos.x},${placePos.y},${placePos.z}`;
                        activeWorldData.modifications[key] = blockToPlace;
                        rebuildBlockAt(key, blockToPlace);
                        playBlockSound(200);
                        broadcastData({ type: 'blockEdit', key: key, blockType: blockToPlace });
                    }
                }
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- PAUSE & SAVE SYSTEM ---
        function resumeGame() {
            document.getElementById('pause-screen').style.display = 'none';
            controls.lock();
        }

        function saveCurrentWorld() {
            if (isHost && activeWorldData) {
                worlds[activeWorldData.id] = activeWorldData;
                localStorage.setItem('dogicraft_worlds', JSON.stringify(worlds));
                alert("💾 World saved successfully!");
            }
        }

        function quitToTitle() {
            saveCurrentWorld();
            gameStarted = false;
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        }

        // --- MAIN GAME ANIMATION LOOP ---
        function animate() {
            if (!gameStarted) return;
            requestAnimationFrame(animate);

            if (controls.isLocked && !isDead) {
                const moveSpeed = 0.08;
                if (keys['w']) controls.moveForward(moveSpeed);
                if (keys['s']) controls.moveForward(-moveSpeed);
                if (keys['a']) controls.moveRight(-moveSpeed);
                if (keys['d']) controls.moveRight(moveSpeed);

                updateChunks();

                velocityY += gravity;
                camera.position.y += velocityY;

                const downRay = new THREE.Raycaster(camera.position, new THREE.Vector3(0, -1, 0), 0, playerHeight);
                const groundHits = downRay.intersectObjects(objects);

                if (groundHits.length > 0) {
                    camera.position.y = groundHits[0].point.y + playerHeight;
                    velocityY = 0;
                    canJump = true;
                }

                if (camera.position.y < -20) takeDamage(10);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
